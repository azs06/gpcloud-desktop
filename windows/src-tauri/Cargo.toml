[package]
name = "gpcloud"
version = "1.0.0"
description = "Unofficial desktop client for Grameenphone GP Cloud"
authors = ["Md Atiquzzaman Soikat"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "gpcloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
sha2 = { version = "0.10", features = ["compress"] }
hex = "0.4"
bytes = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
url = "2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
