name: Release macOS

on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "macos-v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Self-test
        run: swift run -c release gpcloud-selftest
      - name: Package
        run: |
          export GPCLOUD_SDK="$(xcrun --show-sdk-path)"
          ./scripts/package-release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="macos-v$(cat VERSION)"
          FILES=(dist/GPCloud-*-macOS.zip dist/GPCloud-*-macOS.zip.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "GP Cloud for Mac $(cat VERSION)" --notes-file CHANGELOG.md
          fi

      # Bumps Casks/gpcloud.rb in azs06/homebrew-tap so `brew upgrade` picks up the release.
      # Needs a repo secret TAP_GITHUB_TOKEN: a fine-grained token with Contents: read & write on azs06/homebrew-tap.
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN not set; skipping Homebrew cask update."
            exit 0
          fi
          VERSION="$(cat VERSION)"
          SHA="$(cut -d' ' -f1 "dist/GPCloud-$VERSION-macOS.zip.sha256")"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/azs06/homebrew-tap.git" tap
          cd tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            -e 's#/releases/download/[^/]*/GPCloud-#/releases/download/macos-v\#{version}/GPCloud-#' \
            Casks/gpcloud.rb
          if git diff --quiet; then echo "Cask already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gpcloud $VERSION"
          git push
