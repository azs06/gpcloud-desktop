name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Self-test
        run: swift run -c release gpcloud-selftest
      - name: Package
        run: |
          export GPCLOUD_SDK="$(xcrun --show-sdk-path)"
          ./scripts/package-release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          FILES=(dist/GPCloud-*-macOS.zip dist/GPCloud-*-macOS.zip.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "GP Cloud for Mac $TAG" --notes-file CHANGELOG.md
          fi
