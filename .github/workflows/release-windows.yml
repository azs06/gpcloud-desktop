name: Release Windows

on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        working-directory: windows/src-tauri
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "windows-v${{ steps.v.outputs.version }}" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - name: Unit tests
        working-directory: windows/src-tauri
        run: cargo test --lib
      - name: Build installers
        run: npx tauri build
      - name: Collect assets
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/GPCloud-$V-Windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "out/GPCloud-$V-Windows-x64.msi"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          TAG="windows-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "GP Cloud for Windows $V" --notes-file CHANGELOG.md
          fi
