name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcrun --show-sdk-path
      - name: Self-test (hashing & upload math)
        run: swift run -c release gpcloud-selftest
      - name: Build universal app
        run: |
          export GPCLOUD_SDK="$(xcrun --show-sdk-path)"
          ./scripts/build-app.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        working-directory: windows/src-tauri
        run: rustup toolchain install 1.90.0 --profile minimal -c clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - name: Unit tests (hashing & upload math, cross-checked with macOS)
        working-directory: windows/src-tauri
        run: cargo test --lib
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
